apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: application-repository
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/MOS-Elecs/discord-bot-apps
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: discord-bot
  namespace: flux-system
spec:
  interval: 1m
  path: ./k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: application-repository
  targetNamespace: bot
